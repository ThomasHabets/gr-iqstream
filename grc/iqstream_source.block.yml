id: iqstream_source
label: IQ Stream Source
category: '[IQ Streaming]'
flags: [python]
parameters:
- id: address
  label: Server or Address
  dtype: raw
  default: "'127.0.0.1:50051'"
- id: resource
  label: Resource ID
  dtype: string
  default: iq
- id: type
  label: Sample Type
  dtype: enum
  default: complex
  options: [float, complex]
  option_labels: [Real float32, Complex float32]
  option_attributes:
    layout: [REAL, COMPLEX]
- id: options
  label: Stream Options
  dtype: raw
  default: iqstream.stream_options()
- id: loss
  label: Loss Policy
  dtype: enum
  default: options
  options: [options, lossless, allow_gaps]
  option_labels: [From Stream Options, Lossless, Allow gaps]
  option_attributes:
    value: [None, iqstream.loss_policy.LOSSLESS, iqstream.loss_policy.ALLOW_GAPS]

outputs:
- domain: stream
  dtype: ${ type }

templates:
  imports: from gnuradio import iqstream
  make: iqstream.source(iqstream.endpoint_address(${address}), ${resource}, iqstream.sample_layout.${type.layout}, iqstream.configured_options(${options}, loss=${loss.value}))
documentation: |-
  Native gRPC streaming for GNU Radio 3.10.12. One real or complex channel.
  Configure stream_options for TLS, loss policy and limits.
  All tag kinds are accepted; values without a PMT mapping are dropped.
  Match the server sink's blocking
  setting: blocking(true) requires Lossless; blocking(false) requires Allow gaps.
  Sending blocks finish their accepted prefix on stop; cancel() aborts.
  ACCEPTED completion does not promise durable storage or downstream DSP completion.
file_format: 1
